# Tiny Tapeout project information
# See https://tinytapeout.com/faq/#what-is-the-info-yaml-file for the full
# schema reference.
 
project:
  title:        "TinyGPU-RV32"       # Project title
  author:       "Mayank Narayan"     # Your name
  discord:      ""                   # Your discord handle, optional
  description:  "A single-core RV32I RISC-V CPU with a memory-mapped debug module and an int8 vector accelerator (VADD8/VSUB8/VMAX8/RELU8/DOT4I8)."
  language:     "Verilog"            # SystemVerilog files are accepted under this same field
  clock_hz:     10000000             # Target clock frequency in Hz -- adjust once OpenLane/LibreLane timing closure tells us a real achievable Fmax
 
  # How many tiles your design occupies. 1x1, 1x2, 2x2, etc. Start at the
  # smallest size and let the precheck/hardening run tell you the real
  # number -- don't guess this from hand area estimates.
  tiles: "4x4"
 
  # Set to true only if the design uses the second (analog) power supply.
  uses_vapwr: false
 
  # List every source file the design needs, in any order (LibreLane's
  # Yosys read-order isn't file-order-dependent for these). Files must
  # live in ./src. Do NOT list the standalone/unused decomposed unit
  # files (alu.sv, decoder.sv, etc.) here -- see docs/info.md for why.
  source_files:
    - "tinygpu_pkg.sv"
    - "scratchpad.sv"
    - "bus_interconnect.sv"
    - "accel_regs.sv"
    - "vector_accel.sv"
    - "rv32_core.sv"
    - "debug_regs.sv"
    - "tinygpu_soc.sv"
    - "tt_um_tinygpu_rv32.sv"
 
  # Must start with "tt_um_" and be globally unique across the shuttle --
  # include your github username to guarantee that.
  top_module:  "tt_um_mayank26102006_tinygpu_rv32"
 
# The pinout section becomes part of the public datasheet. Fill these in
# to match exactly what tt_um_tinygpu_rv32.sv actually wires to each pin.
pinout:
  # Dedicated inputs
  ui[0]: "dbg_halt_req"
  ui[1]: "dbg_resume_req"
  ui[2]: "dbg_step_req"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
 
  # Dedicated outputs
  uo[0]: "cpu_halted"
  uo[1]: "cpu_trap"
  uo[2]: "accel_busy"
  uo[3]: "accel_done"
  uo[4]: "accel_error"
  uo[5]: "trap_cause[0]"
  uo[6]: "trap_cause[1]"
  uo[7]: "trap_cause[2]"
 
  # Bidirectional pins -- all 8 are driven as outputs only (uio_oe=8'hFF),
  # exposing the low byte of the program counter for external debug/trace
  uio[0]: "pc[0] (output only)"
  uio[1]: "pc[1] (output only)"
  uio[2]: "pc[2] (output only)"
  uio[3]: "pc[3] (output only)"
  uio[4]: "pc[4] (output only)"
  uio[5]: "pc[5] (output only)"
  uio[6]: "pc[6] (output only)"
  uio[7]: "pc[7] (output only)"
 
# Do not change!
yaml_version: 6
